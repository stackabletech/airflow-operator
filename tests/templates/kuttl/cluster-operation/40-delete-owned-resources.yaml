---
# Every resource the operator applies carries an ownerReference and a `.owns()` watch
# (main.rs); deleting it must trigger a reconcile of the AirflowCluster, which re-applies
# it. This step checks that chain — the ClusterRole's `watch` verbs plus the `.owns()`
# routing — and lives here because this test already cycles the pods. The `.watches()`
# registrations (AuthenticationClass, and ConfigMaps referenced but not owned) can't be
# tested by deletion: the operator never recreates what it didn't apply.
#
# Recreation is proven by UID change: mere existence could pass without any deletion.
# TestStep commands run exactly once (no kuttl retry loop), so the polling stays quiet.
#
# The random Secrets are deliberately absent. They carry an ownerReference but are
# intentionally not `.owns()`-registered: nothing reads their contents.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
metadata:
  name: delete-owned-resources
timeout: 300
commands:
  - script: |
      set -eu

      delete_and_await_recreation() {
        kind=$1
        name=$2
        old_uid=$(kubectl get -n "$NAMESPACE" "$kind" "$name" -o jsonpath='{.metadata.uid}')
        kubectl delete -n "$NAMESPACE" "$kind" "$name" --wait=false
        # Recreation is a single reconcile away, so this normally succeeds on the
        # first iteration; 30s is a generous upper bound well below the step timeout.
        for _ in $(seq 1 30); do
          new_uid=$(kubectl get -n "$NAMESPACE" "$kind" "$name" -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
          if [ -n "$new_uid" ] && [ "$new_uid" != "$old_uid" ]; then
            return 0
          fi
          sleep 1
        done
        echo "$kind/$name was not recreated (old uid: $old_uid, current: '${new_uid:-}')" >&2
        return 1
      }

      delete_and_await_recreation serviceaccount       airflow-serviceaccount
      delete_and_await_recreation rolebinding          airflow-rolebinding
      delete_and_await_recreation poddisruptionbudget  airflow-webserver
      delete_and_await_recreation poddisruptionbudget  airflow-worker
      delete_and_await_recreation poddisruptionbudget  airflow-scheduler
      # Same name as the webserver PodDisruptionBudget above; the kinds keep them apart.
      delete_and_await_recreation listener             airflow-webserver
      delete_and_await_recreation configmap            airflow-worker-default
      delete_and_await_recreation service              airflow-webserver-default-headless
      delete_and_await_recreation service              airflow-webserver-default-metrics
      delete_and_await_recreation service              airflow-worker-default-headless
      delete_and_await_recreation service              airflow-worker-default-metrics
      delete_and_await_recreation service              airflow-scheduler-default-headless
      delete_and_await_recreation service              airflow-scheduler-default-metrics
      delete_and_await_recreation statefulset          airflow-webserver-default
      delete_and_await_recreation statefulset          airflow-worker-default
      delete_and_await_recreation statefulset          airflow-scheduler-default
