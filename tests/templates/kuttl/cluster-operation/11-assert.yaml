---
# The scheduler process was killed in the previous step. The start script ends in
# `wait_for_termination $!`, so the container must exit and be restarted by Kubernetes.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
metadata:
  name: test-scheduler-is-supervised
timeout: 120
commands:
  - script: |
      for _ in $(seq 15); do
          restart_count=$(kubectl -n $NAMESPACE get pod airflow-scheduler-default-0 \
              -o jsonpath='{.status.containerStatuses[?(@.name=="airflow")].restartCount}')

          if [ "${restart_count:-0}" -ge 1 ]; then
              exit 0
          fi

          sleep 2
      done

      echo "The scheduler died but its container was not restarted."
      echo "Kubernetes considers the Pod healthy:"
      kubectl -n $NAMESPACE get pod airflow-scheduler-default-0

      echo "Airflow does not:"
      kubectl -n $NAMESPACE exec -i airflow-scheduler-default-0 -c airflow -- python - <<'EOF'
      import requests

      health = requests.get("http://airflow-webserver:8080/api/v2/monitor/health", timeout=10).json()

      print(f"  scheduler:     {health['scheduler']}")
      print(f"  dag_processor: {health['dag_processor']}")
      EOF

      exit 1

  - script: |
      kubectl -n $NAMESPACE exec -i airflow-webserver-default-0 -c airflow -- python - <<'EOF'
      import sys
      import time

      import requests

      HEALTH_URL = "http://airflow-webserver:8080/api/v2/monitor/health"
      HEARTBEATS = {
          "scheduler": "latest_scheduler_heartbeat",
          "dag_processor": "latest_dag_processor_heartbeat",
      }

      baseline = None

      for attempt in range(1, 21):
          try:
              response = requests.get(HEALTH_URL, timeout=10)
          except requests.RequestException as error:
              print(f"attempt {attempt}: {error}")
          else:
              if response.ok:
                  health = response.json()
                  state = {
                      name: (health[name]["status"], health[name][key])
                      for name, key in HEARTBEATS.items()
                  }

                  if baseline is None:
                      baseline = {name: heartbeat for name, (_, heartbeat) in state.items()}
                      print(f"heartbeats before the restart took effect: {baseline}")
                  elif all(
                      status == "healthy" and heartbeat != baseline[name]
                      for name, (status, heartbeat) in state.items()
                  ):
                      print(f"recovered after the restart on attempt {attempt}: {state}")
                      break
                  else:
                      print(f"attempt {attempt}: {state}")
              else:
                  print(f"attempt {attempt}: HTTP {response.status_code} {response.text[:200]}")

          time.sleep(3)
      else:
          sys.exit("the restarted container did not bring the scheduler and dag-processor back")
      EOF
