---
# The recreated StatefulSets must bring the cluster back to ready, and the recreated
# objects must carry an owner reference back to the AirflowCluster so that garbage
# collection still works for them. The worker is at three replicas here: 10-pause raised
# it while reconciliation was paused, and 30-restart let that take effect.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
metadata:
  name: recreate-owned-resources
timeout: 600
commands:
  - script: kubectl -n $NAMESPACE wait --for=condition=available airflowclusters.airflow.stackable.tech/airflow --timeout 601s
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-webserver-default
  ownerReferences:
    - apiVersion: airflow.stackable.tech/v1alpha2
      controller: true
      kind: AirflowCluster
      name: airflow
status:
  readyReplicas: 1
  replicas: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-worker-default
  ownerReferences:
    - apiVersion: airflow.stackable.tech/v1alpha2
      controller: true
      kind: AirflowCluster
      name: airflow
status:
  readyReplicas: 3
  replicas: 3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-scheduler-default
  ownerReferences:
    - apiVersion: airflow.stackable.tech/v1alpha2
      controller: true
      kind: AirflowCluster
      name: airflow
status:
  readyReplicas: 1
  replicas: 1
