---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
metadata:
  name: kill-scheduler
timeout: 60
commands:
  # Killing a scheduler that is already gone would make the assert of this step fail for
  # the wrong reason, so establish that Airflow considers the scheduler alive first.
  - script: |
      kubectl -n $NAMESPACE exec -i airflow-scheduler-default-0 -c airflow -- python - <<'EOF'
      import sys

      import requests

      health = requests.get("http://airflow-webserver:8080/api/v2/monitor/health", timeout=10).json()

      print(f"scheduler before the kill: {health['scheduler']}")

      if health["scheduler"]["status"] != "healthy":
          sys.exit("expected a healthy scheduler")
      EOF

  # Kill the `airflow scheduler` process. The product image contains neither `ps` nor
  # `pkill`, so the process is looked up in /proc. The generated start script runs as
  # PID 1 and backgrounds the product processes, which makes the scheduler a direct
  # child of PID 1. Searching all of /proc instead would also match PID 1 itself,
  # whose command line is the entire start script.
  - script: |
      kubectl -n $NAMESPACE exec -i airflow-scheduler-default-0 -c airflow -- bash <<'EOF'
      set -euo pipefail

      scheduler_killed=false

      for pid in $(cat /proc/1/task/1/children); do
          command_line=$(tr '\0' ' ' < "/proc/$pid/cmdline")

          case "$command_line" in
          *"airflow scheduler"*)
              echo "Killing the scheduler (PID $pid)"
              kill -9 "$pid"
              scheduler_killed=true
              ;;
          esac
      done

      if [ "$scheduler_killed" = false ]; then
          echo "No scheduler process found" >&2
          exit 1
      fi
      EOF
