---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
metadata:
  name: kill-scheduler
timeout: 120
commands:
  - script: |
      restart_count=$(kubectl -n $NAMESPACE get pod airflow-scheduler-default-0 \
          -o jsonpath='{.status.containerStatuses[?(@.name=="airflow")].restartCount}')

      if [ "${restart_count:-0}" -ne 0 ]; then
          echo "The airflow container already restarted ${restart_count} times before the" \
               "kill, so a restart afterwards would not prove that the scheduler is" \
               "supervised." >&2
          exit 1
      fi

  - script: |
      kubectl -n $NAMESPACE exec -i airflow-scheduler-default-0 -c airflow -- python - <<'EOF'
      import sys
      import time

      import requests

      HEALTH_URL = "http://airflow-webserver:8080/api/v2/monitor/health"

      for attempt in range(1, 11):
          try:
              response = requests.get(HEALTH_URL, timeout=10)
          except requests.RequestException as error:
              print(f"attempt {attempt}: {error}")
          else:
              if response.ok:
                  scheduler = response.json()["scheduler"]

                  if scheduler["status"] == "healthy":
                      print(f"scheduler before the kill: {scheduler}")
                      break

                  print(f"attempt {attempt}: scheduler is {scheduler}")
              else:
                  print(f"attempt {attempt}: HTTP {response.status_code} {response.text[:200]}")

          time.sleep(3)
      else:
          sys.exit("expected a healthy scheduler, see the attempts above")
      EOF

  - script: |
      kubectl -n $NAMESPACE exec -i airflow-scheduler-default-0 -c airflow -- bash <<'EOF'
      set -euo pipefail

      scheduler_killed=false

      for pid in $(cat /proc/1/task/1/children); do
          command_line=$(tr '\0' ' ' < "/proc/$pid/cmdline")

          case "$command_line" in
          *"airflow scheduler"*)
              echo "Killing the scheduler (PID $pid)"
              kill -9 "$pid"
              scheduler_killed=true
              ;;
          esac
      done

      if [ "$scheduler_killed" = false ]; then
          echo "No scheduler process found" >&2
          exit 1
      fi
      EOF
