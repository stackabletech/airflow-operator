# Run tests with `./test-vector.sh`
#
# A downside of these test cases is that they compare the whole event and that the message can
# contain source code positions in vector.yaml. Please adapt the tests if you change VRL code in
# vector.yaml.
---
tests:
  - name: Test stdout log entry
    inputs:
      - type: log
        insert_at: processed_files_stdout
        log_fields:
          file: /stackable/log/airflow/airflow.stdout.log
          message: Starting gunicorn
          pod: airflow-webserver-default-0
          source_type: file
          timestamp: 2025-10-02T09:27:28.582Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "airflow",
                "container": "airflow",
                "file": "airflow.stdout.log",
                "level": "INFO",
                "logger": "ROOT",
                "message": "Starting gunicorn",
                "namespace": "default",
                "pod": "airflow-webserver-default-0",
                "role": "webserver",
                "roleGroup": "default",
                "timestamp": "2025-10-02T09:27:28.582Z"
              }

              assert_eq!(expected_log_event, .)
  - name: Test stderr log entry
    inputs:
      - type: log
        insert_at: processed_files_stderr
        log_fields:
          file: /stackable/log/airflow/airflow.stderr.log
          message: "Traceback (most recent call last):"
          pod: airflow-webserver-default-0
          source_type: file
          timestamp: 2025-10-02T09:27:28.582Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "airflow",
                "container": "airflow",
                "file": "airflow.stderr.log",
                "level": "ERROR",
                "logger": "ROOT",
                "message": "Traceback (most recent call last):",
                "namespace": "default",
                "pod": "airflow-webserver-default-0",
                "role": "webserver",
                "roleGroup": "default",
                "timestamp": "2025-10-02T09:27:28.582Z"
              }

              assert_eq!(expected_log_event, .)
  - name: Test Python JSON log entry
    inputs:
      - type: log
        insert_at: processed_files_py
        log_fields:
          file: /stackable/log/airflow/airflow.py.json
          message: '{"asctime": "2025-10-02 09:27:28,582", "levelname": "INFO", "name": "airflow.app", "message": "Loading app"}'
          pod: airflow-webserver-default-0
          source_type: file
          timestamp: 2025-10-02T09:27:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "airflow",
                "container": "airflow",
                "file": "airflow.py.json",
                "level": "INFO",
                "logger": "airflow.app",
                "message": "Loading app",
                "namespace": "default",
                "pod": "airflow-webserver-default-0",
                "role": "webserver",
                "roleGroup": "default",
                "timestamp": t'2025-10-02T09:27:28.582Z'
              }

              assert_eq!(expected_log_event, .)
  - name: Test tracing-rs log
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: '{"timestamp":"2026-11-02T14:49:28.028922Z","level":"INFO","fields":{"message":"found disk","disk.mount_point":"/","disk.name":"overlay","disk.space.total":52513820672,"disk.space.used":24405733376,"disk.space.available":28108087296,"disk.space.usage_percent":"46.5%"},"target":"containerdebug::system_information::disk","span":{"name":"Disk::collect_all"},"spans":[{"name":"containerdebug run"},{"name":"SystemInformation::collect"},{"name":"Disk::collect_all"}]}'
          pod: airflow-webserver-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "airflow",
                "container": "containerdebug",
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "containerdebug::system_information::disk",
                "message": "found disk\n\ndisk.mount_point=/\ndisk.name=overlay\ndisk.space.available=28108087296\ndisk.space.total=52513820672\ndisk.space.usage_percent=46.5%\ndisk.space.used=24405733376",
                "namespace": "default",
                "pod": "airflow-webserver-default-0",
                "role": "webserver",
                "roleGroup": "default",
                "timestamp": t'2026-11-02T14:49:28.028922Z'
              }

              assert_eq!(expected_log_event, .)
  - name: Test unparsable tracing-rs log
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: '{ unparsable'
          pod: airflow-webserver-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "airflow",
                "container": "containerdebug",
                "errors": [
                  .errors[0]
                ],
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "",
                "message": "{ unparsable",
                "namespace": "default",
                "pod": "airflow-webserver-default-0",
                "role": "webserver",
                "roleGroup": "default",
                "timestamp": .timestamp
              }

              assert_eq!(expected_log_event, .)

              # The remainder of the message contains character offsets into
              # the VRL source, so only the stable prefix is asserted.
              assert!(starts_with!(.errors[0], "JSON not parsable: "))
  - name: Test tracing-rs log which is not a JSON object
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: 'false'
          pod: airflow-webserver-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "airflow",
                "container": "containerdebug",
                "errors": [
                  "Parsed event is not a JSON object."
                ],
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "",
                "message": "false",
                "namespace": "default",
                "pod": "airflow-webserver-default-0",
                "role": "webserver",
                "roleGroup": "default",
                "timestamp": .timestamp
              }

              assert_eq!(expected_log_event, .)
  - name: Test tracing-rs log with invalid fields
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: '{"timestamp":"unparsable","level":"INVALID","fields":"none","target":null}'
          pod: airflow-webserver-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "airflow",
                "container": "containerdebug",
                "errors": [
                  .errors[0],
                  "Logger/target not found.",
                  "Level \"INVALID\" unknown, using \"INFO\" instead.",
                  "Fields are not an object."
                ],
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "",
                "message": "{\"timestamp\":\"unparsable\",\"level\":\"INVALID\",\"fields\":\"none\",\"target\":null}",
                "namespace": "default",
                "pod": "airflow-webserver-default-0",
                "role": "webserver",
                "roleGroup": "default",
                "timestamp": .timestamp
              }

              assert_eq!(expected_log_event, .)

              # The remainder of the message contains character offsets into
              # the VRL source, so only the stable prefix is asserted.
              assert!(starts_with!(.errors[0], "Timestamp not parsable, using current time instead: "))
  - name: Test tracing-rs log without a timestamp
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: '{"level":"INFO","fields":{"message":"found disk"},"target":"containerdebug::system_information::disk"}'
          pod: airflow-webserver-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "airflow",
                "container": "containerdebug",
                "errors": [
                  "Timestamp not found, using current time instead."
                ],
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "containerdebug::system_information::disk",
                "message": "found disk",
                "namespace": "default",
                "pod": "airflow-webserver-default-0",
                "role": "webserver",
                "roleGroup": "default",
                "timestamp": .timestamp
              }

              assert_eq!(expected_log_event, .)

              # The current time is used and not the timestamp which the file
              # source attached to the event. The latter reaches the transform
              # as a string, whereas now() yields a timestamp.
              assert!(is_timestamp(.timestamp))
  - name: Test tracing-rs log without a message but with other fields
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: '{"timestamp":"2026-11-02T14:49:28.028922Z","level":"INFO","fields":{"disk.name":"overlay"},"target":"containerdebug::system_information::disk"}'
          pod: airflow-webserver-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "airflow",
                "container": "containerdebug",
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "containerdebug::system_information::disk",
                "message": "disk.name=overlay",
                "namespace": "default",
                "pod": "airflow-webserver-default-0",
                "role": "webserver",
                "roleGroup": "default",
                "timestamp": t'2026-11-02T14:49:28.028922Z'
              }

              assert_eq!(expected_log_event, .)
  - name: Test tracing-rs log with a message which is not a string
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: '{"timestamp":"2026-11-02T14:49:28.028922Z","level":"INFO","fields":{"message":42,"disk.name":"overlay"},"target":"containerdebug::system_information::disk"}'
          pod: airflow-webserver-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "airflow",
                "container": "containerdebug",
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "containerdebug::system_information::disk",
                "message": "disk.name=overlay\nmessage=42",
                "namespace": "default",
                "pod": "airflow-webserver-default-0",
                "role": "webserver",
                "roleGroup": "default",
                "timestamp": t'2026-11-02T14:49:28.028922Z'
              }

              assert_eq!(expected_log_event, .)
  - name: Test tracing-rs log without any fields
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: '{"timestamp":"2026-11-02T14:49:28.028922Z","level":"INFO","fields":{},"target":"containerdebug::system_information::disk"}'
          pod: airflow-webserver-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "airflow",
                "container": "containerdebug",
                "errors": [
                  "Message not found."
                ],
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "containerdebug::system_information::disk",
                "message": "",
                "namespace": "default",
                "pod": "airflow-webserver-default-0",
                "role": "webserver",
                "roleGroup": "default",
                "timestamp": t'2026-11-02T14:49:28.028922Z'
              }

              assert_eq!(expected_log_event, .)
  - name: Test Vector internal logs
    inputs:
      - type: log
        insert_at: filtered_logs_vector
        log_fields:
          arch: x86_64
          message: Vector has started.
          metadata:
            kind: event
            level: INFO
            module_path: vector::internal_events::process
            target: vector
          pid: 14
          pod: airflow-webserver-default-0
          source_type: internal_logs
          timestamp: 2025-10-02T09:46:14.479381097Z
          version: 0.56.0
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "arch": "x86_64",
                "cluster": "airflow",
                "container": "vector",
                "level": "INFO",
                "logger": "vector::internal_events::process",
                "message": "Vector has started.",
                "namespace": "default",
                "pod": "airflow-webserver-default-0",
                "role": "webserver",
                "roleGroup": "default",
                "timestamp": "2025-10-02T09:46:14.479381097Z",
                "version": "0.56.0"
              }

              assert_eq!(expected_log_event, .)
  - name: Test Vector internal log level filtering - INFO passes
    inputs:
      - type: log
        insert_at: filtered_logs_vector
        log_fields:
          metadata:
            level: INFO
    outputs:
      - extract_from: filtered_logs_vector
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              assert_eq!("INFO", .metadata.level)
  - name: Test Vector internal log level filtering - DEBUG dropped
    inputs:
      - type: log
        insert_at: filtered_logs_vector
        log_fields:
          metadata:
            level: DEBUG
    no_outputs_from:
      - filtered_logs_vector
